# Smithery configuration for ANP: Revendas GLP
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_anp_revendas

name: anp_revendas-mcp
displayName: "ANP: Revendas GLP"
description: >
  ANP: Revendas GLP, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/anp_revendas-mcp
repository: https://github.com/mcp-dir/anp_revendas-mcp

tags:
  - anp_revendas
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_anp_revendas

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_anp_revendas/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
